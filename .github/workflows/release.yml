name: Release

# Two ways to publish a release:
#  1. Actions tab -> "Release" -> "Run workflow": bumps the version from the commits since the
#     last tag (or the chosen bump), updates CHANGELOG.md, commits, tags and publishes.
#  2. Push a tag vX.Y.Z yourself (for example with scripts/release.ps1 -Push).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = from Conventional Commits)"
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create release commit and tag
        if: github.event_name == 'workflow_dispatch'
        id: bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/release.ps1 -Bump "${{ inputs.bump }}" -SkipBuild -Push

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ steps.bump.outputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag) { throw "No release tag resolved." }
          $version = $tag.TrimStart('v')
          $artifact = "dist/MicMix-$version-win64.ts3_plugin"
          $checksum = "$artifact.sha256"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=$artifact" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -Version "${{ steps.meta.outputs.version }}"

      - name: Generate SHA256 file
        shell: pwsh
        run: |
          $artifact = "${{ steps.meta.outputs.artifact }}"
          if (-not (Test-Path $artifact)) {
            throw "Artifact not found: $artifact"
          }
          $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash
          $fileName = [System.IO.Path]::GetFileName($artifact)
          $line = "$hash  $fileName"
          Set-Content -LiteralPath "${{ steps.meta.outputs.checksum }}" -Value $line -Encoding ascii

      - name: Build release notes
        id: notes
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"

          $body = "Automated release for $tag.`n`nIncluded assets:`n- MicMix-$version-win64.ts3_plugin`n- MicMix-$version-win64.ts3_plugin.sha256"

          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match ("^## \[" + [regex]::Escape($version) + "\]")) {
                $start = $i
                break
              }
            }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($j = $start + 1; $j -lt $lines.Count; $j++) {
                if ($lines[$j] -match "^## \[") {
                  $end = $j
                  break
                }
              }
              $body = ($lines[$start..($end - 1)] -join "`n")
            }
          }

          Set-Content -LiteralPath $notesPath -Value $body -Encoding utf8
          "path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MicMix ${{ steps.meta.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            ${{ steps.meta.outputs.artifact }}
            ${{ steps.meta.outputs.checksum }}
